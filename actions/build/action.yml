name: 'geoBoundaryBot Build'
description: 'Run the geoBoundaries build pipeline for a specific boundary'

inputs:
  build-type:
    description: 'Release type (e.g., gbOpen, gbHumanitarian, gbAuthoritative)'
    required: true
  build-ver:
    description: 'Build version: nightly or release'
    required: true
    default: 'nightly'
  countries:
    description: 'Comma-separated ISO country codes to process'
    required: true
  adm-level:
    description: 'Boundary type filter (e.g., ADM0, ADM1)'
    required: true
  api-key:
    description: 'GitHub API token for GraphQL queries and issue creation'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create working directories
      shell: bash
      run: mkdir -p ~/tmp ~/artifacts ~/working

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: '0.12.15'
        enable-cache: false

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: uv sync --locked

    - name: Run build
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      env:
        ADM_LEVEL: ${{ inputs.adm-level }}
        BUILD_TYPE: ${{ inputs.build-type }}
        BUILD_VER: ${{ inputs.build-ver }}
        COUNTRIES: ${{ inputs.countries }}
        PYTHONPATH: ${{ github.action_path }}/../..
        GITHUB_TOKEN: ${{ inputs.api-key }}
      run: |
        uv run --no-sync python -m main \
          --build-type "$BUILD_TYPE" \
          --build-ver "$BUILD_VER" \
          --countries "$COUNTRIES" \
          --type-query "$ADM_LEVEL" \
          --api-key "$GITHUB_TOKEN"
