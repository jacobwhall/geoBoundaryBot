image:
  repository: ghcr.io/wmgeolab/geoboundarybot
  tag: latest
  pullPolicy: Always

# Build pipeline. Two CronJobs are produced from `build.nightly` and
# `build.release` — both run the same image and code path, differentiated
# only by env vars (GB_RELEASE_VERSION, GB_STRICT, GB_PROMOTE_CURRENT).
#
# Only one build may run at a time: both CronJobs share the Dask cluster,
# the data PVC and the ephemeral PostGIS, so the driver holds a Kubernetes
# Lease (<release>-build-lock) for the whole run. `lockWaitSeconds` controls
# what a build does if the lock is already held: 0 = exit 1 immediately,
# N = wait up to N seconds for the other build to finish.
#
# Trigger a release manually:
#   helm upgrade ... --reuse-values --set build.release.version=v7
#   kubectl create job --from=cronjob/<release>-build-release <job-name>
build:
  sync:
    dataRepo: https://github.com/wmgeolab/geoBoundaries.git
    branch: main
    lfs: true
  dask:
    workers: 48 # scale target during builds (scaled to 0 when idle)
  resources:
    requests:
      memory: 2Gi
      cpu: "1"
    limits:
      memory: 4Gi
      cpu: "2"

  # IANA time zone the CronJob schedules below are read in.
  timeZone: America/New_York

  nightly:
    schedule: "0 2 * * *"
    suspend: false
    version: nightly
    strict: false
    promoteCurrent: false
    # Fail fast if a release build is running; the next nightly picks it up.
    lockWaitSeconds: 0

  release:
    # Suspended — never fires on its own. Trigger manually with
    #   kubectl create job --from=cronjob/<release>-build-release ...
    schedule: "0 5 31 2 *" # placeholder; suspended
    suspend: true
    version: v6 # override per release via --set build.release.version=v7
    strict: true
    promoteCurrent: true
    # Wait for an in-flight nightly to finish (up to 6h) rather than fail
    # the manually triggered release.
    lockWaitSeconds: 21600

# Persistent volume for the geoBoundaries data repo
volume:
  storageClass: ""
  size: 250Gi
  accessModes:
    - ReadWriteMany

# Dask subchart configuration
# https://github.com/dask/helm-chart
dask:
  scheduler:
    image:
      repository: ghcr.io/wmgeolab/geoboundarybot
      tag: latest
    serviceType: ClusterIP
    env:
      - name: PYTHONPATH
        value: /app

  worker:
    replicas: 0 # run.py scales workers up/down during builds
    image:
      repository: ghcr.io/wmgeolab/geoboundarybot
      tag: latest
    env:
      - name: PYTHONPATH
        value: /app
      - name: GB_REPO_DIR
        value: /data/geoBoundaries
    resources:
      requests:
        memory: 4Gi
        cpu: "2"
      limits:
        memory: 20Gi
        cpu: "4"
    mounts:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: geoboundaries-data
      volumeMounts:
        - name: data
          mountPath: /data/geoBoundaries
          readOnly: true

  jupyter:
    enabled: false

# S3-compatible storage for build outputs (e.g. Cloudflare R2).
# Disabled by default. Create the credentials secret before enabling:
#   kubectl create secret generic gb-s3-credentials \
#     --from-literal=access-key-id=<key> \
#     --from-literal=secret-access-key=<secret>
# Objects are uploaded under <GB_RELEASE_VERSION>/<product>/<ISO>/<ADM>/...
# and <GB_RELEASE_VERSION>/CGAZ/...
s3:
  enabled: false
  endpoint: "" # e.g. https://<account>.r2.cloudflarestorage.com
  bucket: ""
  credentialsSecret: gb-s3-credentials

# Ephemeral PostGIS for passing build outputs to CGAZ: the boundary builds,
# the LSIB base layer and the per-country CGAZ parts all land here, and the
# CGAZ merge Job reads them back
builddb:
  image:
    repository: postgis/postgis
    tag: "17-3.5"
  storageClass: ""
  size: 250Gi
  # Must exceed the Dask cluster's total threads (build.dask.workers x
  # threads per worker), since every running task may hold a connection.
  maxConnections: 500
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
  # Postgres's shared_buffers; about a quarter of the memory request.
  sharedBuffers: 4GB
